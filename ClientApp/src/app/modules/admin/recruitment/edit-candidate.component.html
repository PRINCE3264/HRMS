<app-page-header title="Edit Candidate Profile" subtitle="Update applicant details, status, interview notes, and contact info" [breadcrumbs]="[{label:'Dashboard',link:'/dashboard'},{label:'Recruitment',link:'/admin/recruitment'},{label:'Edit Candidate'}]">
  <button class="btn btn--outline" (click)="cancel()"><i class="fas fa-arrow-left"></i> Back to List</button>
</app-page-header>

<div class="form-container">
  <div class="form-card">
    <div class="card-header">
      <h3><i class="fas fa-user-edit"></i> Edit Candidate Details</h3>
    </div>

    <div class="card-body">
      <div class="form-grid">
        <div class="form-group">
          <label>First Name *</label>
          <input type="text" [(ngModel)]="formData.firstName" placeholder="e.g. Aarav" />
        </div>

        <div class="form-group">
          <label>Last Name</label>
          <input type="text" [(ngModel)]="formData.lastName" placeholder="e.g. Sharma" />
        </div>

        <div class="form-group">
          <label>Email Address *</label>
          <input type="email" [(ngModel)]="formData.email" placeholder="aarav@example.com" />
        </div>

        <div class="form-group">
          <label>Phone Number</label>
          <input type="text" [(ngModel)]="formData.phone" placeholder="+91 98765 43210" />
        </div>

        <div class="form-group">
          <label>Applied Position</label>
          <select [(ngModel)]="formData.jobTitle">
            <option *ngFor="let pos of jobPositions" [value]="pos">{{ pos }}</option>
          </select>
        </div>

        <div class="form-group">
          <label>Years of Experience</label>
          <input type="text" [(ngModel)]="formData.experience" placeholder="e.g. 4.5 years" />
        </div>

        <div class="form-group">
          <label>Pipeline Status</label>
          <select [(ngModel)]="formData.status">
            <option value="NEW">New</option>
            <option value="SHORTLISTED">Shortlisted</option>
            <option value="INTERVIEW_SCHEDULED">Interview Scheduled</option>
            <option value="OFFER_EXTENDED">Offer Extended</option>
            <option value="HIRED">Hired</option>
            <option value="REJECTED">Rejected</option>
          </select>
        </div>
      </div>

      <div class="form-group full-width mt-3">
        <label>Candidate Interview & Evaluation Notes</label>
        <textarea rows="3" [(ngModel)]="formData.notes" placeholder="Enter evaluation notes, interviewer feedback, or salary expectations..."></textarea>
      </div>
    </div>

    <div class="card-footer">
      <button class="btn btn--cancel" (click)="cancel()">Cancel</button>
      <button class="btn btn--primary" (click)="save()" [disabled]="loading">
        <i class="fas fa-check"></i> {{ loading ? 'Updating...' : 'Update Candidate Profile' }}
      </button>
    </div>
  </div>
</div>
