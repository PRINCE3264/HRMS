<app-page-header title="Email / SMS Configuration" subtitle="Configure outgoing email (SMTP) and SMS gateway settings" [breadcrumbs]="[{label:'Dashboard',link:'/admin/dashboard'},{label:'Settings'},{label:'Email/SMS'}]">
  <button class="btn btn--primary" (click)="save()" [disabled]="saving">
    <i class="fas fa-save"></i> {{ saving ? 'Saving...' : 'Save Configuration' }}
  </button>
</app-page-header>

<div class="config-grid">
  <div class="section-card">
    <div class="section-title"><i class="fas fa-envelope"></i> SMTP / Email Settings</div>
    <div class="form-field form-field--wide">
      <label>SMTP Host</label>
      <input type="text" class="filter-input" [(ngModel)]="email.smtpHost" placeholder="smtp.gmail.com" />
    </div>
    <div class="form-field">
      <label>SMTP Port</label>
      <input type="text" class="filter-input" [(ngModel)]="email.smtpPort" placeholder="587" />
    </div>
    <div class="form-field">
      <label>Username</label>
      <input type="text" class="filter-input" [(ngModel)]="email.smtpUsername" placeholder="noreply@company.com" />
    </div>
    <div class="form-field">
      <label>Password / App Password</label>
      <input type="password" class="filter-input" [(ngModel)]="email.smtpPassword" placeholder="••••••••" />
    </div>
    <div class="form-field form-field--wide">
      <label>From Address</label>
      <input type="text" class="filter-input" [(ngModel)]="email.smtpFrom" placeholder="HRM Pro <noreply@company.com>" />
    </div>
  </div>

  <div class="section-card">
    <div class="section-title"><i class="fas fa-sms"></i> SMS Gateway Settings</div>
    <div class="form-field form-field--wide">
      <label>API URL</label>
      <input type="text" class="filter-input" [(ngModel)]="sms.apiUrl" placeholder="https://api.smsprovider.com/send" />
    </div>
    <div class="form-field form-field--wide">
      <label>API Key</label>
      <input type="password" class="filter-input" [(ngModel)]="sms.apiKey" placeholder="••••••••" />
    </div>
    <div class="form-field">
      <label>Sender ID</label>
      <input type="text" class="filter-input" [(ngModel)]="sms.senderId" placeholder="HRMPRO" />
    </div>
  </div>
</div>

<div class="info-banner">
  <i class="fas fa-info-circle"></i>
  These credentials are used by the backend to deliver leave, payroll, attendance and announcement notifications.
</div>
