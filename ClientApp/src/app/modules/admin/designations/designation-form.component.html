<app-page-header
  [title]="isEdit ? 'Edit Designation' : 'Create Designation'"
  [subtitle]="isEdit ? 'Update designation title, level, and salary scale' : 'Add a new job designation to organizational hierarchy'"
  [breadcrumbs]="[{label:'Dashboard',link:'/admin/dashboard'},{label:'Designations',link:'/admin/designations'},{label: isEdit ? 'Edit' : 'Create'}]">
  <a routerLink="/admin/designations" class="btn btn--outline">
    <i class="fas fa-arrow-left"></i> Back to Designations
  </a>
</app-page-header>

<div class="form-container-card">
  <div *ngIf="loading" class="loading-spinner-box">
    <i class="fas fa-spinner fa-spin"></i> Loading designation details...
  </div>

  <form *ngIf="!loading" (ngSubmit)="onSubmit()" class="desig-main-form">
    <div class="form-header-title">
      <h3><i class="fas fa-id-badge text-blue"></i> Designation Details</h3>
    </div>

    <div class="form-grid-layout">
      <!-- Designation Title -->
      <div class="form-group">
        <label class="form-label">Designation Title <span class="required">*</span></label>
        <div class="input-wrapper">
          <i class="fas fa-briefcase input-icon"></i>
          <input type="text" [(ngModel)]="form.title" name="title" required placeholder="e.g. Senior Software Engineer" class="form-input" />
        </div>
      </div>

      <!-- Level -->
      <div class="form-group">
        <label class="form-label">Level <span class="required">*</span></label>
        <div class="input-wrapper">
          <i class="fas fa-layer-group input-icon"></i>
          <input type="text" [(ngModel)]="form.level" name="level" required placeholder="e.g. L3 / Senior" class="form-input" />
        </div>
      </div>

      <!-- Department Select -->
      <div class="form-group full-width">
        <label class="form-label">Department</label>
        <div class="input-wrapper">
          <i class="fas fa-building input-icon"></i>
          <select [(ngModel)]="form.departmentId" name="departmentId" class="form-select">
            <option value="">-- Select Department --</option>
            <option *ngFor="let d of departments" [value]="d.id">{{ d.name }} ({{ d.code }})</option>
          </select>
        </div>
      </div>

      <!-- Salary Range -->
      <div class="form-group">
        <label class="form-label">Minimum Salary ($)</label>
        <div class="input-wrapper">
          <i class="fas fa-dollar-sign input-icon"></i>
          <input type="number" [(ngModel)]="form.minSalary" name="minSalary" placeholder="e.g. 45000" class="form-input" />
        </div>
      </div>

      <div class="form-group">
        <label class="form-label">Maximum Salary ($)</label>
        <div class="input-wrapper">
          <i class="fas fa-dollar-sign input-icon"></i>
          <input type="number" [(ngModel)]="form.maxSalary" name="maxSalary" placeholder="e.g. 95000" class="form-input" />
        </div>
      </div>

      <!-- Status -->
      <div class="form-group full-width">
        <label class="form-label">Status</label>
        <div class="input-wrapper">
          <i class="fas fa-toggle-on input-icon"></i>
          <select [(ngModel)]="form.status" name="status" class="form-select">
            <option value="Active">Active</option>
            <option value="Inactive">Inactive</option>
          </select>
        </div>
      </div>
    </div>

    <!-- Actions -->
    <div class="form-actions-footer">
      <a routerLink="/admin/designations" class="btn-cancel">Cancel</a>
      <button type="submit" class="btn-submit" [disabled]="saving">
        <span *ngIf="saving" class="spinner"></span>
        <i *ngIf="!saving" class="fas fa-check"></i>
        <span>{{ saving ? 'Saving...' : (isEdit ? 'Update Designation' : 'Create Designation') }}</span>
      </button>
    </div>
  </form>
</div>
