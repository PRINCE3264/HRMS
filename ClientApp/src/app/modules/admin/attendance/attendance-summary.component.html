<app-page-header title="Attendance Reports" subtitle="Monthly attendance summary and late arrival tracking" [breadcrumbs]="[{label:'Dashboard',link:'/admin/dashboard'},{label:'Attendance'},{label:'Reports'}]">
  <button class="btn btn--outline" (click)="loadSummary()"><i class="fas fa-sync-alt"></i> Refresh</button>
</app-page-header>

<div class="filter-card">
  <div class="filter-bar">
    <div class="filter-group">
      <i class="far fa-calendar-alt filter-icon"></i>
      <input type="date" class="filter-input" [(ngModel)]="startDate" />
    </div>
    <div class="filter-group">
      <i class="far fa-calendar-alt filter-icon"></i>
      <input type="date" class="filter-input" [(ngModel)]="endDate" />
    </div>
    <button class="btn btn--primary" (click)="loadSummary()"><i class="fas fa-filter"></i> Apply Range</button>
  </div>
</div>

<div class="table-card">
  <h3 class="table-title"><i class="fas fa-user-clock"></i> Attendance Summary</h3>
  <app-loading-spinner *ngIf="loading"></app-loading-spinner>
  <app-data-table
    *ngIf="!loading"
    [columns]="columns"
    [data]="summary"
    [pageSize]="10">
  </app-data-table>
  <div class="empty-state" *ngIf="!loading && summary.length === 0">
    <i class="fas fa-chart-bar"></i>
    <p>No attendance records for the selected period.</p>
  </div>
</div>

<div class="table-card">
  <h3 class="table-title"><i class="fas fa-hourglass-end"></i> Late Arrivals</h3>
  <app-data-table
    [columns]="lateColumns"
    [data]="lateArrivals"
    [pageSize]="10">
  </app-data-table>
  <div class="empty-state" *ngIf="lateArrivals.length === 0">
    <i class="fas fa-check-circle"></i>
    <p>No late arrivals in the selected period.</p>
  </div>
</div>
