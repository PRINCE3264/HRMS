<app-page-header title="Attendance Management" subtitle="Track employee attendance and working hours" [breadcrumbs]="[{label:'Dashboard',link:'/admin/dashboard'},{label:'Attendance'}]">
  <button class="btn btn--outline"><i class="fas fa-download"></i> Download Report</button>
  <button class="btn btn--primary"><i class="fas fa-calendar-plus"></i> Mark Attendance</button>
</app-page-header>

<!-- Mini Stats Cards Row -->
<div class="stats-row">
  <div class="mini-stat present">
    <div class="stat-top">
      <span class="stat-dot present-dot"></span>
      <span class="mini-stat__label">Present</span>
    </div>
    <span class="mini-stat__value">198</span>
  </div>
  <div class="mini-stat absent">
    <div class="stat-top">
      <span class="stat-dot absent-dot"></span>
      <span class="mini-stat__label">Absent</span>
    </div>
    <span class="mini-stat__value">33</span>
  </div>
  <div class="mini-stat late">
    <div class="stat-top">
      <span class="stat-dot late-dot"></span>
      <span class="mini-stat__label">Late</span>
    </div>
    <span class="mini-stat__value">12</span>
  </div>
  <div class="mini-stat leave">
    <div class="stat-top">
      <span class="stat-dot leave-dot"></span>
      <span class="mini-stat__label">On Leave</span>
    </div>
    <span class="mini-stat__value">18</span>
  </div>
  <div class="mini-stat wfh">
    <div class="stat-top">
      <span class="stat-dot wfh-dot"></span>
      <span class="mini-stat__label">Work From Home</span>
    </div>
    <span class="mini-stat__value">27</span>
  </div>
</div>

<!-- Filter Bar -->
<div class="filter-card">
  <div class="filter-bar">
    <div class="filter-group">
      <i class="far fa-calendar-alt filter-icon"></i>
      <input type="date" class="filter-input" value="2024-12-19" />
    </div>
    <div class="filter-group">
      <i class="fas fa-building filter-icon"></i>
      <select class="filter-select">
        <option value="">All Departments</option>
        <option>Engineering</option>
        <option>Marketing</option>
        <option>Sales</option>
        <option>HR</option>
        <option>Finance</option>
      </select>
    </div>
    <div class="filter-group">
      <i class="fas fa-filter filter-icon"></i>
      <select class="filter-select">
        <option value="">All Status</option>
        <option>Present</option>
        <option>Absent</option>
        <option>Late</option>
        <option>On Leave</option>
      </select>
    </div>
  </div>
</div>

<!-- Attendance Data Table Container -->
<div class="table-card">
  <app-data-table 
    [columns]="columns" 
    [data]="attendanceRecords" 
    [pageSize]="10" 
    [actions]="tableActions" 
    (onActionClick)="onAction($event)">
  </app-data-table>
</div>
