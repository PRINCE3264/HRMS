<app-page-header title="Attendance Management" subtitle="Track employee attendance and working hours" [breadcrumbs]="[{label:'Dashboard',link:'/admin/dashboard'},{label:'Attendance'}]">
  <button class="btn btn--outline"><i class="fas fa-download"></i> Download Report</button>
  <button class="btn btn--primary"><i class="fas fa-calendar-plus"></i> Mark Attendance</button>
</app-page-header>

<!-- Mini Stats Cards Row -->
<div class="stats-row">
  <div class="mini-stat present">
    <div class="stat-top">
      <span class="stat-dot present-dot"></span>
      <span class="mini-stat__label">Present</span>
    </div>
    <span class="mini-stat__value">198</span>
  </div>
  <div class="mini-stat absent">
    <div class="stat-top">
      <span class="stat-dot absent-dot"></span>
      <span class="mini-stat__label">Absent</span>
    </div>
    <span class="mini-stat__value">33</span>
  </div>
  <div class="mini-stat late">
    <div class="stat-top">
      <span class="stat-dot late-dot"></span>
      <span class="mini-stat__label">Late</span>
    </div>
    <span class="mini-stat__value">12</span>
  </div>
  <div class="mini-stat leave">
    <div class="stat-top">
      <span class="stat-dot leave-dot"></span>
      <span class="mini-stat__label">On Leave</span>
    </div>
    <span class="mini-stat__value">18</span>
  </div>
  <div class="mini-stat wfh">
    <div class="stat-top">
      <span class="stat-dot wfh-dot"></span>
      <span class="mini-stat__label">Work From Home</span>
    </div>
    <span class="mini-stat__value">27</span>
  </div>
</div>

<!-- Filter Bar -->
<div class="filter-card">
  <div class="filter-bar">
    <div class="filter-group">
      <i class="far fa-calendar-alt filter-icon"></i>
      <input type="date" class="filter-input" value="2024-12-19" />
    </div>
    <div class="filter-group">
      <i class="fas fa-building filter-icon"></i>
      <select class="filter-select">
        <option value="">All Departments</option>
        <option>Engineering</option>
        <option>Marketing</option>
        <option>Sales</option>
        <option>HR</option>
        <option>Finance</option>
      </select>
    </div>
    <div class="filter-group">
      <i class="fas fa-filter filter-icon"></i>
      <select class="filter-select">
        <option value="">All Status</option>
        <option>Present</option>
        <option>Absent</option>
        <option>Late</option>
        <option>On Leave</option>
      </select>
    </div>
  </div>
</div>

<!-- Attendance Data Table Container -->
<div class="table-card">
  <app-data-table 
    [columns]="columns" 
    [data]="attendanceRecords" 
    [pageSize]="10" 
    [actions]="tableActions" 
    (onActionClick)="onAction($event)">
  </app-data-table>
</div>

<!-- Correction Request Modal -->
<div class="modal-overlay" *ngIf="showCorrection" (click)="showCorrection = false">
  <div class="correction-modal" (click)="$event.stopPropagation()">
    <div class="modal-header">
      <h3><i class="fas fa-user-edit"></i> Attendance Correction</h3>
      <button class="modal-close" (click)="showCorrection = false"><i class="fas fa-times"></i></button>
    </div>
    <div class="modal-body">
      <div class="form-group">
        <label>Date</label>
        <input type="date" class="filter-input" [(ngModel)]="correctionForm.date" />
      </div>
      <div class="form-row">
        <div class="form-group">
          <label>Corrected Check In</label>
          <input type="time" class="filter-input" [(ngModel)]="correctionForm.checkIn" />
        </div>
        <div class="form-group">
          <label>Corrected Check Out</label>
          <input type="time" class="filter-input" [(ngModel)]="correctionForm.checkOut" />
        </div>
      </div>
      <div class="form-group">
        <label>Reason *</label>
        <input type="text" class="filter-input" [(ngModel)]="correctionForm.reason" placeholder="Why is this correction needed?" />
      </div>
      <div class="form-note"><i class="fas fa-info-circle"></i> The request will be sent for approval by HR.</div>
    </div>
    <div class="modal-footer">
      <button class="btn btn--outline" (click)="showCorrection = false">Cancel</button>
      <button class="btn btn--primary" (click)="submitCorrection()"><i class="fas fa-check"></i> Submit Request</button>
    </div>
  </div>
</div>
