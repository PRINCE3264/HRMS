<app-page-header title="Departments" subtitle="Manage organizational departments" [breadcrumbs]="[{label:'Dashboard',link:'/dashboard'},{label:'Departments'}]">
  <button class="btn btn--primary" (click)="openAdd()"><i class="fas fa-plus"></i> Add Department</button>
</app-page-header>

<div class="card-grid" *ngIf="departments.length > 0; else emptyState">
  <div class="dept-card" *ngFor="let dept of departments">
    <div class="dept-card__header">
      <div class="dept-card__icon"><i class="fas fa-building"></i></div>
      <app-status-badge [status]="dept.status"></app-status-badge>
    </div>
    <div class="dept-card__info">
      <h3>{{ dept.name }}</h3>
      <span class="dept-card__code">{{ dept.code }}</span>
    </div>
    <p>{{ dept.description || 'No description provided.' }}</p>
    <div class="dept-card__footer">
      <span><i class="fas fa-users"></i> {{ dept.employeeCount }} employees</span>
      <span><i class="fas fa-user-tie"></i> {{ getHeadName(dept) }}</span>
    </div>
    <div class="dept-card__actions">
      <button class="action-btn action-btn--edit" (click)="openEdit(dept)"><i class="fas fa-edit"></i> Edit</button>
      <button class="action-btn action-btn--delete" (click)="deleteDepartment(dept)"><i class="fas fa-trash"></i> Delete</button>
    </div>
  </div>
</div>

<ng-template #emptyState>
  <div class="empty-state">
    <i class="fas fa-building"></i>
    <h3>No departments found</h3>
    <p>Create your first department to get started.</p>
  </div>
</ng-template>

<!-- Create / Edit Department Modal -->
<div class="modal-backdrop" *ngIf="showForm">
  <div class="modal-card">
    <div class="modal-header">
      <h3><i class="fas fa-building text-blue"></i> {{ isEdit ? 'Edit Department' : 'Create New Department' }}</h3>
      <button class="close-btn" (click)="closeForm()"><i class="fas fa-times"></i></button>
    </div>
    <div class="modal-body">
      <div class="form-grid">
        <div class="form-group full-width">
          <label>Department Name <span class="required">*</span></label>
          <input type="text" [(ngModel)]="form.name" placeholder="e.g. Engineering" class="form-control" />
        </div>

        <div class="form-group">
          <label>Department Code <span class="required">*</span></label>
          <input type="text" [(ngModel)]="form.code" placeholder="e.g. ENG" class="form-control" />
        </div>

        <div class="form-group">
          <label>Department Head</label>
          <select [(ngModel)]="form.headId" class="form-control">
            <option value="">-- Unassigned --</option>
            <option *ngFor="let emp of employees" [value]="emp.id">{{ emp.fullName }} ({{ emp.designation || 'Employee' }})</option>
          </select>
        </div>

        <div class="form-group full-width">
          <label>Description</label>
          <textarea [(ngModel)]="form.description" rows="3" placeholder="Purpose and responsibilities..." class="form-control"></textarea>
        </div>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn-cancel" (click)="closeForm()">Cancel</button>
      <button class="btn-save" (click)="saveForm()"><i class="fas fa-check"></i> {{ isEdit ? 'Update Department' : 'Create Department' }}</button>
    </div>
  </div>
</div>
