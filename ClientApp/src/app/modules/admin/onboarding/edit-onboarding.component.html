<app-page-header title="Edit Onboarding Candidate" subtitle="Update onboarding progress, mentor assignment, and orientation details" [breadcrumbs]="[{label:'Dashboard',link:'/dashboard'},{label:'Onboarding',link:'/admin/onboarding'},{label:'Edit Candidate'}]">
  <button class="btn btn--outline" (click)="cancel()"><i class="fas fa-arrow-left"></i> Back to List</button>
</app-page-header>

<div class="form-container">
  <div class="form-card">
    <div class="card-header">
      <h3><i class="fas fa-user-edit"></i> Edit Onboarding Candidate Details</h3>
    </div>

    <div class="card-body">
      <div class="form-grid">
        <div class="form-group">
          <label>Employee Full Name *</label>
          <input type="text" [(ngModel)]="formData.employeeName" placeholder="e.g. Alice Cooper" />
        </div>

        <div class="form-group">
          <label>Position / Role *</label>
          <input type="text" [(ngModel)]="formData.position" placeholder="e.g. Senior Frontend Developer" />
        </div>

        <div class="form-group">
          <label>Department</label>
          <select [(ngModel)]="formData.department">
            <option *ngFor="let dept of departments" [value]="dept">{{ dept }}</option>
          </select>
        </div>

        <div class="form-group">
          <label>Joining Date</label>
          <input type="date" [(ngModel)]="formData.startDate" />
        </div>

        <div class="form-group">
          <label>Email Address</label>
          <input type="email" [(ngModel)]="formData.email" placeholder="alice@envision.com" />
        </div>

        <div class="form-group">
          <label>Phone Number</label>
          <input type="text" [(ngModel)]="formData.phone" placeholder="+1 (555) 000-0000" />
        </div>

        <div class="form-group">
          <label>Assigned Mentor</label>
          <input type="text" [(ngModel)]="formData.mentorName" placeholder="e.g. Michael Chen" />
        </div>

        <div class="form-group">
          <label>Status</label>
          <select [(ngModel)]="formData.status">
            <option value="IN_PROGRESS">In Progress</option>
            <option value="COMPLETED">Completed</option>
            <option value="UPCOMING">Upcoming</option>
          </select>
        </div>
      </div>

      <div class="form-group full-width mt-3">
        <label>Orientation & Progress Notes</label>
        <textarea rows="3" [(ngModel)]="formData.notes" placeholder="Enter orientation notes, equipment requirements, or status updates..."></textarea>
      </div>
    </div>

    <div class="card-footer">
      <button class="btn btn--cancel" (click)="cancel()">Cancel</button>
      <button class="btn btn--primary" (click)="save()" [disabled]="loading">
        <i class="fas fa-check"></i> {{ loading ? 'Updating...' : 'Update Details' }}
      </button>
    </div>
  </div>
</div>
