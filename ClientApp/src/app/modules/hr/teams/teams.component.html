<app-page-header title="Teams" subtitle="Manage team assignments" [breadcrumbs]="[{label:'Dashboard',link:'/dashboard'},{label:'Teams'}]">
      <button class="btn btn--primary"><i class="fas fa-plus"></i> Create Team</button>
    </app-page-header>
    <div class="teams-grid">
      <div class="team-card" *ngFor="let team of teams">
        <div class="team-card-top">
          <div class="team-icon" [style.background]="team.color"><i [class]="team.icon"></i></div>
          <span class="team-dept-badge">{{ team.department }}</span>
        </div>
        <h3 class="team-name">{{ team.name }}</h3>
        <p class="team-lead">
          <i class="fas fa-user-tie"></i> {{ team.lead }}
        </p>
        <div class="team-members-row">
          <div class="member-avatars">
            <div class="member-avatar" *ngFor="let m of team.memberAvatars; let i = index" [style.background]="team.color" [style.z-index]="10 - i">{{ m }}</div>
            <div class="member-avatar more" *ngIf="team.memberCount > 4">+{{ team.memberCount - 4 }}</div>
          </div>
          <span class="member-count">{{ team.memberCount }} members</span>
        </div>
        <div class="team-tags">
          <span class="tag" *ngFor="let tag of team.tags">{{ tag }}</span>
        </div>
        <div class="team-footer">
          <span class="team-status" [class]="team.status.toLowerCase()">{{ team.status }}</span>
          <span class="team-progress">{{ team.progress }}% complete</span>
        </div>
        <div class="progress-bar">
          <div class="progress-fill" [style.width]="team.progress + '%'" [style.background]="team.color"></div>
        </div>
      </div>
    </div>
