<app-page-header title="Onboarding" subtitle="Track new employee onboarding progress" [breadcrumbs]="[{label:'Dashboard',link:'/dashboard'},{label:'Onboarding'}]">
      <button class="btn btn--primary"><i class="fas fa-plus"></i> Start Onboarding</button>
    </app-page-header>
    <div class="onboard-stats">
      <div class="o-stat"><span class="o-val">8</span><span class="o-label">In Progress</span></div>
      <div class="o-stat"><span class="o-val">3</span><span class="o-label">Completed This Month</span></div>
      <div class="o-stat"><span class="o-val">5</span><span class="o-label">Starting Next Week</span></div>
      <div class="o-stat"><span class="o-val">92%</span><span class="o-label">Completion Rate</span></div>
    </div>
    <div class="onboard-grid">
      <div class="onboard-card" *ngFor="let emp of onboarding">
        <div class="onboard-card-header">
          <div class="avatar-md" [style.background]="emp.color">{{ emp.name.charAt(0) }}</div>
          <div>
            <h4>{{ emp.name }}</h4>
            <span class="onboard-role">{{ emp.role }}</span>
          </div>
        </div>
        <div class="onboard-dept">{{ emp.department }} &middot; {{ emp.startDate }}</div>
        <div class="onboard-progress-section">
          <div class="progress-header">
            <span>Progress</span>
            <span class="progress-pct">{{ emp.progress }}%</span>
          </div>
          <div class="progress-bar">
            <div class="progress-fill" [style.width]="emp.progress + '%'" [style.background]="emp.progress === 100 ? '#10b981' : '#6366f1'"></div>
          </div>
        </div>
        <div class="onboard-tasks">
          <div class="task-item" *ngFor="let task of emp.tasks">
            <i [class]="task.done ? 'fas fa-check-circle' : 'far fa-circle'" [style.color]="task.done ? '#10b981' : '#cbd5e1'"></i>
            <span [class.done]="task.done">{{ task.label }}</span>
          </div>
        </div>
        <div class="onboard-footer">
          <span class="onboard-status" [class]="emp.progress === 100 ? 'completed' : 'in-progress'">
            {{ emp.progress === 100 ? 'Completed' : 'In Progress' }}
          </span>
          <button class="btn-sm">View Details</button>
        </div>
      </div>
    </div>
