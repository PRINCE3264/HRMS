<app-page-header
  [title]="isEdit ? 'Edit Department' : 'Create Department'"
  [subtitle]="isEdit ? 'Update department information and leadership' : 'Add a new organizational department'"
  [breadcrumbs]="[{label:'Dashboard',link:'/hr/dashboard'},{label:'Departments',link:'/hr/departments'},{label: isEdit ? 'Edit' : 'Create'}]">
  <a routerLink="/hr/departments" class="btn btn--outline">
    <i class="fas fa-arrow-left"></i> Back to Departments
  </a>
</app-page-header>

<div class="form-container-card">
  <div *ngIf="loading" class="loading-spinner-box">
    <i class="fas fa-spinner fa-spin"></i> Loading department details...
  </div>

  <form *ngIf="!loading" (ngSubmit)="onSubmit()" class="dept-main-form">
    <div class="form-header-title">
      <h3><i class="fas fa-building text-blue"></i> Department Information</h3>
    </div>

    <div class="form-grid-layout">
      <!-- Department Name -->
      <div class="form-group">
        <label class="form-label">Department Name <span class="required">*</span></label>
        <div class="input-wrapper">
          <i class="fas fa-building input-icon"></i>
          <input type="text" [(ngModel)]="form.name" name="name" required placeholder="e.g. Marketing" class="form-input" />
        </div>
      </div>

      <!-- Department Code -->
      <div class="form-group">
        <label class="form-label">Department Code <span class="required">*</span></label>
        <div class="input-wrapper">
          <i class="fas fa-hashtag input-icon"></i>
          <input type="text" [(ngModel)]="form.code" name="code" required placeholder="e.g. MKT" class="form-input" />
        </div>
      </div>

      <!-- Department Head -->
      <div class="form-group">
        <label class="form-label">Department Head (HOD)</label>
        <div class="input-wrapper">
          <i class="fas fa-user-tie input-icon"></i>
          <select [(ngModel)]="form.headId" name="headId" class="form-select">
            <option value="">-- Unassigned --</option>
            <option *ngFor="let emp of employees" [value]="emp.id">{{ emp.fullName }} ({{ emp.designation || 'Employee' }})</option>
          </select>
        </div>
      </div>

      <!-- Status -->
      <div class="form-group">
        <label class="form-label">Status</label>
        <div class="input-wrapper">
          <i class="fas fa-toggle-on input-icon"></i>
          <select [(ngModel)]="form.status" name="status" class="form-select">
            <option value="Active">Active</option>
            <option value="Inactive">Inactive</option>
          </select>
        </div>
      </div>

      <!-- Cover Image Upload & URL -->
      <div class="form-group full-width">
        <label class="form-label">Cover Image</label>
        <div class="image-upload-box">
          <div class="image-preview-container" *ngIf="form.imageUrl">
            <img [src]="resolveImage(form.imageUrl)" alt="Cover Preview" class="cover-preview" />
            <button type="button" class="btn-remove-img" (click)="removeImage()"><i class="fas fa-times"></i></button>
          </div>

          <div class="upload-controls">
            <button type="button" class="btn-upload-file" (click)="fileInput.click()">
              <i class="fas fa-cloud-upload-alt"></i> Upload Cover Image
            </button>
            <input #fileInput type="file" accept="image/*" hidden (change)="onImageSelected($event)" />
            <span class="upload-hint">Or paste an image URL below</span>
          </div>
        </div>
      </div>

      <div class="form-group full-width">
        <label class="form-label">Image URL (Optional)</label>
        <div class="input-wrapper">
          <i class="fas fa-link input-icon"></i>
          <input type="url" [(ngModel)]="form.imageUrl" name="imageUrl" placeholder="https://images.unsplash.com/..." class="form-input" />
        </div>
      </div>

      <!-- Description -->
      <div class="form-group full-width">
        <label class="form-label">Description</label>
        <textarea [(ngModel)]="form.description" name="description" rows="4" placeholder="Scope, purpose, and responsibilities of this department..." class="form-textarea"></textarea>
      </div>
    </div>

    <!-- Actions -->
    <div class="form-actions-footer">
      <a routerLink="/hr/departments" class="btn-cancel">Cancel</a>
      <button type="submit" class="btn-submit" [disabled]="saving">
        <span *ngIf="saving" class="spinner"></span>
        <i *ngIf="!saving" class="fas fa-check"></i>
        <span>{{ saving ? 'Saving...' : (isEdit ? 'Update Department' : 'Create Department') }}</span>
      </button>
    </div>
  </form>
</div>
