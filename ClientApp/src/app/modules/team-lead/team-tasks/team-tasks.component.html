<app-page-header title="Team Tasks" subtitle="Manage team tasks and assignments" [breadcrumbs]="[{label:'Dashboard',link:'/team-lead/dashboard'},{label:'Team'},{label:'Tasks'}]"></app-page-header>
    <div class="toolbar">
      <div class="filter-group">
        <select [(ngModel)]="filterAssignee">
          <option value="">All Members</option>
          <option *ngFor="let m of uniqueAssignees" [value]="m">{{ m }}</option>
        </select>
        <select [(ngModel)]="filterPriority">
          <option value="">All Priorities</option>
          <option value="URGENT">Urgent</option>
          <option value="HIGH">High</option>
          <option value="MEDIUM">Medium</option>
          <option value="LOW">Low</option>
        </select>
      </div>
      <button class="btn-primary" (click)="showAddTask = !showAddTask"><i class="fas fa-plus"></i> Add Task</button>
    </div>
    <div class="kanban-board">
      <div class="kanban-column" *ngFor="let col of columns">
        <div class="column-header">
          <div class="column-title"><span class="column-dot" [style.background]="col.color"></span>{{ col.title }} <span class="count">{{ getColumnTasks(col.key).length }}</span></div>
        </div>
        <div class="column-body">
          <div class="task-card" *ngFor="let task of getColumnTasks(col.key)" [class]="'task-card--' + task.priority.toLowerCase()">
            <div class="task-card-header">
              <span class="priority-badge" [class]="'priority--' + task.priority.toLowerCase()">{{ task.priority }}</span>
              <span class="task-id">{{ task.id }}</span>
            </div>
            <h4 class="task-title">{{ task.title }}</h4>
            <p class="task-desc">{{ task.description }}</p>
            <div class="task-card-footer">
              <div class="assignee">
                <div class="avatar-xs">{{ task.assignee.charAt(0) }}</div>
                <span>{{ task.assignee }}</span>
              </div>
              <div class="task-meta">
                <span [class.overdue]="task.isOverdue"><i class="fas fa-calendar"></i> {{ task.dueDate }}</span>
              </div>
            </div>
          </div>
          <div *ngIf="getColumnTasks(col.key).length === 0" class="empty-col">No tasks</div>
        </div>
      </div>
    </div>
