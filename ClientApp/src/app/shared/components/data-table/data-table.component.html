<div class="table-wrapper">
      <div class="table-header" *ngIf="showHeader">
        <div class="table-search">
          <i class="fas fa-search"></i>
          <input type="text" placeholder="Search..." [(ngModel)]="searchTerm" (ngModelChange)="onSearch()">
        </div>
        <div class="table-filters">
          <ng-content select="[tableFilters]"></ng-content>
        </div>
        <div class="table-actions">
          <ng-content select="[tableActions]"></ng-content>
        </div>
      </div>
      <div class="table-container">
        <table class="table">
          <thead>
            <tr>
              <th *ngIf="selectable" class="table__checkbox">
                <input type="checkbox" [checked]="allSelected" (change)="toggleAll()">
              </th>
              <th *ngFor="let col of columns" [style.width]="col.width" [class.table__th--sortable]="col.sortable" [class.table__th--right]="col.align === 'right'" (click)="onSort(col)">
                <div class="th-content">
                  {{ col.label }}
                  <span class="sort-icon" *ngIf="col.sortable">
                    <i class="fas" [class.fa-sort]="sortKey !== col.key" [class.fa-sort-up]="sortKey === col.key && sortDir === 'asc'" [class.fa-sort-down]="sortKey === col.key && sortDir === 'desc'"></i>
                  </span>
                </div>
              </th>
              <th *ngIf="actions?.length" style="width: 120px">Actions</th>
            </tr>
          </thead>
          <tbody>
            <tr *ngFor="let row of pagedData; let i = index" [class.table__row--selected]="selectedItems.has(row)" (click)="onRowClick.emit(row)">
              <td *ngIf="selectable" class="table__checkbox">
                <input type="checkbox" [checked]="selectedItems.has(row)" (change)="toggleRow(row); $event.stopPropagation()">
              </td>
              <td *ngFor="let col of columns" [class.table__td--right]="col.align === 'right'">
                <ng-container [ngSwitch]="col.type">
                  <app-status-badge *ngSwitchCase="'status'" [status]="row[col.key]"></app-status-badge>
                  <span *ngSwitchCase="'currency'" class="currency">{{ row[col.key] | currency:'USD':'symbol':'1.0-0' }}</span>
                  <span *ngSwitchCase="'date'">{{ row[col.key] | date:'mediumDate' }}</span>
                  <img *ngSwitchCase="'image'" [src]="row[col.key]" class="table__avatar" alt="">
                  <span *ngSwitchDefault>{{ row[col.key] }}</span>
                </ng-container>
              </td>
              <td *ngIf="actions?.length" class="table__actions-cell">
                <button *ngFor="let act of actions" class="table__action-btn" [title]="act.label" [style.color]="act.color || '#64748b'" (click)="onAction(act.action, row); $event.stopPropagation()">
                  <i [class]="act.icon"></i>
                </button>
              </td>
            </tr>
            <tr *ngIf="!pagedData?.length">
              <td [attr.colspan]="columns.length + (selectable ? 1 : 0) + (actions.length ? 1 : 0)">
                <app-empty-state [title]="emptyTitle" [message]="emptyMessage" [icon]="emptyIcon"></app-empty-state>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
      <div class="table-footer" *ngIf="totalItems > 0">
        <div class="table-info">
          Showing {{ startIndex + 1 }} to {{ endIndex }} of {{ totalItems }} entries
        </div>
        <div class="table-pagination">
          <button class="pagination-btn" [disabled]="currentPage === 1" (click)="goToPage(currentPage - 1)">
            <i class="fas fa-chevron-left"></i>
          </button>
          <button *ngFor="let page of visiblePages" class="pagination-btn" [class.active]="page === currentPage" (click)="goToPage(page)">{{ page }}</button>
          <button class="pagination-btn" [disabled]="currentPage === totalPages" (click)="goToPage(currentPage + 1)">
            <i class="fas fa-chevron-right"></i>
          </button>
        </div>
      </div>
    </div>
