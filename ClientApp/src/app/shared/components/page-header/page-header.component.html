<div class="page-header">
      <div class="page-header__left">
        <div>
          <nav class="page-header__breadcrumb" *ngIf="breadcrumbs?.length">
            <a *ngFor="let bc of breadcrumbs" [routerLink]="bc.link" class="page-header__breadcrumb-item">
              <i [class]="bc.icon" *ngIf="bc.icon"></i>
              {{ bc.label }}
            </a>
          </nav>
          <h1 class="page-header__title">{{ title }}</h1>
          <p class="page-header__subtitle" *ngIf="subtitle">{{ subtitle }}</p>
        </div>
      </div>
      <div class="page-header__right">
        <ng-content></ng-content>
      </div>
    </div>
