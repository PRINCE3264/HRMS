<div class="chart-container">
  <div class="chart-header" *ngIf="title">
    <h3>{{ title }}</h3>
  </div>
  <div class="donut-chart">
    <div class="donut-ring">
      <svg viewBox="0 0 36 36">
        <circle 
          *ngFor="let seg of segments; let i = index" 
          class="donut-segment" 
          cx="18" cy="18" r="15.9155" 
          fill="none" 
          [attr.stroke]="seg.color" 
          stroke-width="3.8" 
          [attr.stroke-dasharray]="seg.percent + ' ' + (100 - seg.percent)" 
          [attr.stroke-dashoffset]="getOffset(i)">
        </circle>
      </svg>
      <div class="donut-center">
        <span class="donut-center__value">{{ total | number }}</span>
        <span class="donut-center__label">Total</span>
      </div>
    </div>
    <div class="donut-legend">
      <div class="legend-item" *ngFor="let seg of segments">
        <span class="legend-dot" [style.background]="seg.color"></span>
        <span class="legend-label">{{ seg.label }}</span>
        <span class="legend-value">{{ seg.value | number }}</span>
        <span class="legend-percent">{{ seg.percent | number:'1.0-1' }}%</span>
      </div>
    </div>
  </div>
</div>
