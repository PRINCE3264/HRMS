<div class="auth-page-wrapper">
  <div class="auth-split-container">
    <!-- Left Form Section (50%) -->
    <div class="auth-left-section">
      <div class="auth-form-box">
        <!-- Brand Header -->
        <div class="brand-header">
          <div class="brand-logo-icon">
            <i class="fas fa-users text-blue"></i>
          </div>
          <div class="brand-info">
            <span class="brand-title">HRMS</span>
            <span class="brand-subtitle">People. Process. Progress.</span>
          </div>
        </div>

        <!-- Welcome Header -->
        <div class="welcome-header">
          <h1 class="welcome-title">Forgot Password?</h1>
          <p class="welcome-sub">Enter your registered email address to receive password reset instructions.</p>
        </div>

        <!-- Form or Success State -->
        <div *ngIf="submitted" class="success-box">
          <div class="success-icon">
            <i class="fas fa-paper-plane"></i>
          </div>
          <h3>Reset Link Sent!</h3>
          <p>If an account exists for <strong>{{ email }}</strong>, you will receive password reset instructions
            shortly.</p>
          <button type="button" class="submit-btn" routerLink="/auth/login">
            Back to Sign In
          </button>
        </div>

        <form *ngIf="!submitted" (ngSubmit)="onSubmit()" class="main-form">
          <!-- Email Field -->
          <div class="form-group">
            <label class="form-label">Email Address</label>
            <div class="input-wrapper">
              <i class="far fa-envelope input-icon"></i>
              <input type="email" [(ngModel)]="email" name="email" required placeholder="Enter your email address">
            </div>
          </div>

          <!-- Submit Button -->
          <button type="submit" class="submit-btn" [disabled]="!email">
            <span>Send Reset Link</span>
          </button>

          <div class="signup-prompt">
            <a routerLink="/auth/login" class="signup-link"><i class="fas fa-arrow-left"></i> Back to Sign In</a>
          </div>

          <!-- Footer Text -->
          <div class="form-footer">
            <span>Together We Build A Better Workplace</span>
          </div>
        </form>
      </div>
    </div>

    <!-- Organic S-Curve Divider -->
    <svg class="curve-divider" viewBox="0 0 140 1000" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M 0 0 C 60 250, -30 750, 80 1000 L 0 1000 Z" fill="#ffffff" />
    </svg>

    <!-- Right Animated Image Banner Section (50%) -->
    <div class="auth-right-banner">
      <!-- Gradient Overlay -->
      <div class="banner-overlay"></div>
    </div>
  </div>
</div>
