<div class="auth-page-wrapper">
  <div class="auth-split-container">
    <!-- Left Form Section (50%) -->
    <div class="auth-left-section">
      <div class="auth-form-box">
        <!-- Brand Header -->
        <div class="brand-header">
          <div class="brand-logo-icon">
            <i class="fas fa-users text-blue"></i>
          </div>
          <div class="brand-info">
            <span class="brand-title">HRMS</span>
            <span class="brand-subtitle">People. Process. Progress.</span>
          </div>
        </div>

        <!-- Welcome Header -->
        <div class="welcome-header">
          <h1 class="welcome-title">Reset Password</h1>
          <p class="welcome-sub">Please enter your new password below.</p>
        </div>

        <!-- Form or Success State -->
        <div *ngIf="submitted" class="success-box">
          <div class="success-icon">
            <i class="fas fa-check-circle"></i>
          </div>
          <h3>Password Reset Successfully!</h3>
          <p>Your password has been updated. You can now sign in with your new credentials.</p>
          <button type="button" class="submit-btn" routerLink="/auth/login">
            Sign In Now
          </button>
        </div>

        <form *ngIf="!submitted" (ngSubmit)="onSubmit()" class="main-form">
          <!-- New Password Field -->
          <div class="form-group">
            <label class="form-label">New Password</label>
            <div class="input-wrapper">
              <i class="fas fa-lock input-icon"></i>
              <input [type]="showPassword ? 'text' : 'password'" [(ngModel)]="password" name="password" required placeholder="Enter new password">
              <button type="button" class="eye-toggle" (click)="showPassword = !showPassword" tabindex="-1">
                <i [class]="showPassword ? 'far fa-eye-slash' : 'far fa-eye'"></i>
              </button>
            </div>
          </div>

          <!-- Confirm New Password Field -->
          <div class="form-group">
            <label class="form-label">Confirm New Password</label>
            <div class="input-wrapper">
              <i class="fas fa-lock input-icon"></i>
              <input [type]="showConfirmPassword ? 'text' : 'password'" [(ngModel)]="confirmPassword" name="confirmPassword" required placeholder="Confirm new password">
              <button type="button" class="eye-toggle" (click)="showConfirmPassword = !showConfirmPassword" tabindex="-1">
                <i [class]="showConfirmPassword ? 'far fa-eye-slash' : 'far fa-eye'"></i>
              </button>
            </div>
            <span class="error-msg" *ngIf="confirmPassword && password !== confirmPassword">Passwords do not match</span>
          </div>

          <!-- Submit Button -->
          <button type="submit" class="submit-btn" [disabled]="!password || password !== confirmPassword">
            <span>Update Password</span>
          </button>

          <div class="signup-prompt">
            <a routerLink="/auth/login" class="signup-link"><i class="fas fa-arrow-left"></i> Back to Sign In</a>
          </div>

          <!-- Footer Text -->
          <div class="form-footer">
            <span>Together We Build A Better Workplace</span>
          </div>
        </form>
      </div>
    </div>

    <!-- Organic S-Curve Divider -->
    <svg class="curve-divider" viewBox="0 0 140 1000" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M 0 0 C 60 250, -30 750, 80 1000 L 0 1000 Z" fill="#ffffff" />
    </svg>

    <!-- Right Animated Image Banner Section (50%) -->
    <div class="auth-right-banner">
      <!-- Gradient Overlay -->
      <div class="banner-overlay"></div>
    </div>
  </div>
</div>
