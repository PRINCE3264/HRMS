<div class="auth-page-wrapper">
  <div class="auth-split-container">
    <!-- Left Form Section (50%) -->
    <div class="auth-left-section">
      <div class="auth-form-box">
        <!-- Brand Header -->
        <div class="brand-header">
          <div class="brand-logo-icon">
            <i class="fas fa-users text-blue"></i>
          </div>
          <div class="brand-info">
            <span class="brand-title">HRMS</span>
            <span class="brand-subtitle">People. Process. Progress.</span>
          </div>
        </div>

        <!-- Welcome Title -->
        <div class="welcome-header">
          <h1 class="welcome-title">Welcome Back</h1>
          <p class="welcome-sub">Sign in to continue to your HRMS</p>
        </div>

        <!-- Login Form -->
        <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="main-form">
          <!-- Email Field -->
          <div class="form-group">
            <label class="form-label">Email or Employee ID</label>
            <div class="input-wrapper" [class.input-error]="isFieldInvalid('email')">
              <i class="far fa-envelope input-icon"></i>
              <input type="email" formControlName="email" placeholder="Email or Employee ID">
            </div>
            <span class="error-msg" *ngIf="isFieldInvalid('email')">Please enter a valid email address</span>
          </div>

          <!-- Password Field -->
          <div class="form-group">
            <label class="form-label">Password</label>
            <div class="input-wrapper" [class.input-error]="isFieldInvalid('password')">
              <i class="fas fa-lock input-icon"></i>
              <input [type]="showPassword ? 'text' : 'password'" formControlName="password" placeholder="Password">
              <button type="button" class="eye-toggle" (click)="showPassword = !showPassword" tabindex="-1">
                <i [class]="showPassword ? 'far fa-eye-slash' : 'far fa-eye'"></i>
              </button>
            </div>
            <span class="error-msg" *ngIf="isFieldInvalid('password')">Password is required</span>
          </div>

          <!-- Options: Remember Me & Forgot Password -->
          <div class="options-row">
            <label class="remember-me">
              <input type="checkbox" formControlName="rememberMe" class="checkbox-input">
              <span>Remember me</span>
            </label>
            <a routerLink="/auth/forgot-password" class="forgot-link">Forgot Password?</a>
          </div>

          <!-- Error Banner -->
          <div class="alert-banner" *ngIf="errorMessage">
            <i class="fas fa-exclamation-circle"></i> {{ errorMessage }}
          </div>

          <!-- Sign In Button -->
          <button type="submit" class="submit-btn" [disabled]="loading">
            <span *ngIf="loading" class="spinner"></span>
            <span>{{ loading ? 'Signing in...' : 'Sign In' }}</span>
          </button>

          <!-- Or Continue With Divider -->
          <div class="divider">
            <span>or continue with</span>
          </div>

          <!-- Social Login Box (Google Only) -->
          <div class="sso-box">
            <button type="button" class="sso-btn" (click)="loginWithGoogle()" title="Sign in with Google">
              <svg width="20" height="20" viewBox="0 0 18 18">
                <path
                  d="M17.64 9.2c0-.637-.057-1.251-.164-1.84H9v3.481h4.844c-.209 1.125-.843 2.078-1.796 2.717v2.259h2.908c1.702-1.567 2.684-3.874 2.684-6.617z"
                  fill="#4285F4" />
                <path
                  d="M9 18c2.43 0 4.467-.806 5.956-2.18l-2.908-2.259c-.806.54-1.837.86-3.048.86-2.344 0-4.328-1.584-5.036-3.711H.957v2.332A8.997 8.997 0 009 18z"
                  fill="#34A853" />
                <path
                  d="M3.964 10.71A5.41 5.41 0 013.682 9c0-.593.102-1.17.282-1.71V4.958H.957A8.996 8.996 0 000 9c0 1.452.348 2.827.957 4.042l3.007-2.332z"
                  fill="#FBBC05" />
                <path
                  d="M9 3.58c1.321 0 2.508.454 3.44 1.345l2.582-2.58C13.463.891 11.426 0 9 0A8.997 8.997 0 00.957 4.958L3.964 7.29C4.672 5.163 6.656 3.58 9 3.58z"
                  fill="#EA4335" />
              </svg>
              <span>Sign in with Google</span>
            </button>
          </div>
        </form>

        <!-- Create Account Link -->
        <div class="signup-prompt">
          <span>Don't have an account? </span>
          <a routerLink="/auth/register" class="signup-link">Create Account</a>
        </div>

        <!-- Footer Text -->
        <div class="form-footer">
          <span>Together We Build A Better Workplace</span>
        </div>
      </div>
    </div>

    <!-- Organic S-Curve Divider -->
    <svg class="curve-divider" viewBox="0 0 140 1000" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M 0 0 C 90 250, -20 750, 80 1000 L 0 1000 Z" fill="#ffffff" />
    </svg>

    <!-- Right Animated Image Banner Section (50%) -->
    <div class="auth-right-banner">
      <!-- Gradient Overlay -->
      <div class="banner-overlay"></div>
    </div>
  </div>
</div>
