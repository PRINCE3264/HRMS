<app-page-header title="Audit Logs" subtitle="Track system activities and changes" [breadcrumbs]="[{label:'Dashboard',link:'/dashboard'},{label:'Audit Logs'}]">
      <button class="btn btn--outline"><i class="fas fa-download"></i> Export Logs</button>
    </app-page-header>

    <div class="filter-bar">
      <input type="date" class="filter-input" />
      <select class="filter-select">
        <option value="">All Modules</option>
        <option>Authentication</option>
        <option>Employee</option>
        <option>Payroll</option>
        <option>Leave</option>
        <option>Settings</option>
        <option>Documents</option>
      </select>
      <select class="filter-select">
        <option value="">All Actions</option>
        <option>CREATE</option>
        <option>UPDATE</option>
        <option>DELETE</option>
        <option>LOGIN</option>
        <option>LOGOUT</option>
      </select>
      <select class="filter-select">
        <option value="">All Users</option>
        <option>jsmith</option>
        <option>sjohnson</option>
        <option>mchen</option>
        <option>admin</option>
      </select>
    </div>

    <app-data-table [columns]="columns" [data]="logs" [pageSize]="15" [actions]="tableActions" (onActionClick)="onAction($event)">
    </app-data-table>
