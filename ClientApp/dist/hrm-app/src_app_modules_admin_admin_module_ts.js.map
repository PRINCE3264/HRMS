<app-page-header title="Teams" subtitle="Manage project and functional teams" [breadcrumbs]="[{label:'Dashboard',link:'/dashboard'},{label:'Teams'}]">
      <button class="btn btn--primary" (click)="showAdd = true"><i class="fas fa-plus"></i> Create Team</button>
    </app-page-header>
    <div class="card-grid">
      <div class="team-card" *ngFor="let team of teams">
        <div class="team-card__top">
          <div class="team-card__avatar" [style.background]="team.color">
            {{ team.name.charAt(0) }}
          </div>
          <div class="team-card__info">
            <h3>{{ team.name }}</h3>
            <span class="team-card__dept">{{ team.department }}</span>
          </div>
          <app-status-badge [status]="team.status"></app-status-badge>
        </div>
        <p class="team-card__desc">{{ team.description }}</p>
        <div class="team-card__members">
          <div class="member-avatars">
            <div class="member-avatar" *ngFor="let m of team.memberAvatars; let i = index" [style.background]="m.color" [style.z-index]="10 - i">
              {{ m.initials }}
            </div>
            <div class="member-avatar member-avatar--more" *ngIf="team.memberCount > 3">
              +{{ team.memberCount - 3 }}
            </div>
          </div>
          <span class="member-count">{{ team.memberCount }} members</span>
        </div>
        <div class="team-card__footer">
          <div class="team-card__lead">
            <i class="fas fa-crown"></i>
            <span>{{ team.lead }}</span>
          </div>
          <span class="team-card__projects">{{ team.activeProjects }} active projects</span>
        </div>
      </div>
    </div>
