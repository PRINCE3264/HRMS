<app-page-header title="My Leave" subtitle="View leave balance and history" [breadcrumbs]="[{label:'Dashboard',link:'/employee/dashboard'},{label:'My Leave'}]"></app-page-header>
    <div class="balance-grid">
      <div class="balance-card" *ngFor="let b of balances">
        <div class="balance-icon" [style.background]="b.bg" [style.color]="b.color"><i class="fas fa-calendar-alt"></i></div>
        <div class="balance-info">
          <div class="balance-type">{{ b.type }}</div>
          <div class="balance-numbers">
            <span class="balance-total">{{ b.total }}</span>
            <span class="balance-sep">/</span>
            <span class="balance-used">{{ b.used }}</span>
            <span class="balance-label">used</span>
          </div>
          <div class="balance-bar"><div class="balance-fill" [style.width]="(b.used/b.total*100)+'%'" [style.background]="b.color"></div></div>
          <div class="balance-remaining"><strong>{{ b.total - b.used }}</strong> days remaining</div>
        </div>
      </div>
    </div>
    <div class="section-card">
      <div class="card-toolbar">
        <h3>Leave History</h3>
        <button class="btn-primary" routerLink="/employee/apply-leave"><i class="fas fa-plus"></i> Apply Leave</button>
      </div>
      <div class="table-responsive">
        <table class="data-table">
          <thead>
            <tr><th>Type</th><th>From</th><th>To</th><th>Days</th><th>Reason</th><th>Status</th><th>Approved By</th></tr>
          </thead>
          <tbody>
            <tr *ngFor="let h of history">
              <td><span class="leave-type-badge" [class]="'leave-type--' + h.type.toLowerCase().replace(' ','-')">{{ h.type }}</span></td>
              <td>{{ h.from }}</td>
              <td>{{ h.to }}</td>
              <td><strong>{{ h.days }}</strong></td>
              <td class="reason-cell">{{ h.reason }}</td>
              <td><app-status-badge [status]="h.status"></app-status-badge></td>
              <td>{{ h.approvedBy }}</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
