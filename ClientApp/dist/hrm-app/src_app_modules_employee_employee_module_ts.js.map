<app-page-header title="Notifications" subtitle="Your notification center" [breadcrumbs]="[{label:'Dashboard',link:'/employee/dashboard'},{label:'Notifications'}]"></app-page-header>
    <div class="section-card">
      <div class="card-toolbar">
        <div class="toolbar-left">
          <span class="unread-count">{{ unreadCount }} unread notifications</span>
        </div>
        <button class="btn-text" (click)="markAllRead()"><i class="fas fa-check-double"></i> Mark All as Read</button>
      </div>
      <div class="notification-list">
        <div class="notif-item" *ngFor="let n of notifications" [class.unread]="!n.read" (click)="n.read = true">
          <div class="notif-icon" [style.background]="n.iconBg" [style.color]="n.iconColor">
            <i [class]="n.icon"></i>
          </div>
          <div class="notif-content">
            <p class="notif-text"><strong>{{ n.title }}</strong> {{ n.message }}</p>
            <span class="notif-time"><i class="fas fa-clock"></i> {{ n.time }}</span>
          </div>
          <div class="notif-actions">
            <button class="btn-icon" *ngIf="!n.read" title="Mark as read" (click)="n.read = true; $event.stopPropagation()"><i class="fas fa-check"></i></button>
            <button class="btn-icon" title="Dismiss" (click)="dismiss(n); $event.stopPropagation()"><i class="fas fa-times"></i></button>
          </div>
        </div>
        <div *ngIf="notifications.length === 0" class="empty-state">
          <i class="fas fa-bell-slash"></i>
          <p>No notifications</p>
        </div>
      </div>
    </div>
