<app-page-header title="Onboarding" subtitle="Track new employee onboarding progress" [breadcrumbs]="[{label:'Dashboard',link:'/dashboard'},{label:'Onboarding'}]">
      <button class="btn btn--primary"><i class="fas fa-plus"></i> New Onboarding</button>
    </app-page-header>

    <div class="onboard-stats">
      <div class="stat-pill active">
        <span class="stat-pill__count">{{ activeOnboardings.length }}</span>
        <span class="stat-pill__label">In Progress</span>
      </div>
      <div class="stat-pill completed">
        <span class="stat-pill__count">12</span>
        <span class="stat-pill__label">Completed (Month)</span>
      </div>
      <div class="stat-pill upcoming">
        <span class="stat-pill__count">3</span>
        <span class="stat-pill__label">Upcoming</span>
      </div>
    </div>

    <div class="onboarding-grid">
      <div class="onboard-card" *ngFor="let person of activeOnboardings">
        <div class="onboard-card__header">
          <div class="onboard-card__avatar" [style.background]="person.color">
            {{ person.initials }}
          </div>
          <div class="onboard-card__info">
            <h4>{{ person.name }}</h4>
            <span>{{ person.position }} - {{ person.department }}</span>
            <span class="onboard-card__date">Joined: {{ person.joinDate }}</span>
          </div>
        </div>
        <div class="onboard-card__progress">
          <div class="progress-bar">
            <div class="progress-bar__fill" [style.width]="person.progress + '%'" [style.background]="person.progress === 100 ? '#10b981' : '#6366f1'"></div>
          </div>
          <span class="progress-text">{{ person.progress }}% complete</span>
        </div>
        <div class="onboard-card__tasks">
          <div class="task" *ngFor="let task of person.tasks" [class.completed]="task.done">
            <i [class]="task.done ? 'fas fa-check-circle' : 'far fa-circle'"></i>
            <span>{{ task.label }}</span>
          </div>
        </div>
        <div class="onboard-card__mentor">
          <i class="fas fa-user-graduate"></i>
          <span>Mentor: {{ person.mentor }}</span>
        </div>
      </div>
    </div>
