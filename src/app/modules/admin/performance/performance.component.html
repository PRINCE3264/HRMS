<app-page-header title="Performance Management" subtitle="Track and evaluate employee performance" [breadcrumbs]="[{label:'Dashboard',link:'/dashboard'},{label:'Performance'}]">
      <button class="btn btn--outline"><i class="fas fa-chart-bar"></i> Analytics</button>
      <button class="btn btn--primary"><i class="fas fa-plus"></i> New Review Cycle</button>
    </app-page-header>

    <div class="perf-summary">
      <div class="perf-card">
        <div class="perf-card__ring" style="--percent: 78; --color: #10b981">
          <span>78%</span>
        </div>
        <span class="perf-card__label">Avg. Rating</span>
      </div>
      <div class="perf-card">
        <div class="perf-card__ring" style="--percent: 92; --color: #6366f1">
          <span>92%</span>
        </div>
        <span class="perf-card__label">Reviews Completed</span>
      </div>
      <div class="perf-card">
        <div class="perf-card__ring" style="--percent: 45; --color: #f59e0b">
          <span>45%</span>
        </div>
        <span class="perf-card__label">PIP Active</span>
      </div>
      <div class="perf-card">
        <div class="perf-card__ring" style="--percent: 68; --color: #06b6d4">
          <span>68%</span>
        </div>
        <span class="perf-card__label">Goals Achieved</span>
      </div>
    </div>

    <app-data-table [columns]="columns" [data]="reviews" [pageSize]="10" [actions]="tableActions" (onActionClick)="onAction($event)">
    </app-data-table>
