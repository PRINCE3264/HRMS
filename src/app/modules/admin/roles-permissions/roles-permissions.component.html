<app-page-header title="Roles & Permissions" subtitle="Manage system roles and access control" [breadcrumbs]="[{label:'Dashboard',link:'/dashboard'},{label:'Roles & Permissions'}]">
      <button class="btn btn--primary"><i class="fas fa-plus"></i> Create Role</button>
    </app-page-header>

    <div class="roles-grid">
      <div class="role-card" *ngFor="let role of roles">
        <div class="role-card__header">
          <div class="role-card__icon" [style.background]="role.color">
            <i [class]="role.icon"></i>
          </div>
          <div class="role-card__title">
            <h3>{{ role.name }}</h3>
            <span>{{ role.userCount }} users assigned</span>
          </div>
        </div>
        <p class="role-card__desc">{{ role.description }}</p>
        <div class="role-card__permissions">
          <span class="perm-tag" *ngFor="let perm of role.permissions" [class.granted]="perm.granted">
            <i [class]="perm.granted ? 'fas fa-check' : 'fas fa-times'"></i>
            {{ perm.label }}
          </span>
        </div>
        <div class="role-card__footer">
          <span class="role-card__level">Level {{ role.level }}</span>
          <div class="role-card__actions">
            <button class="icon-btn" title="Edit"><i class="fas fa-edit"></i></button>
            <button class="icon-btn" title="Clone"><i class="fas fa-copy"></i></button>
            <button class="icon-btn icon-btn--danger" title="Delete" *ngIf="!role.isDefault"><i class="fas fa-trash"></i></button>
          </div>
        </div>
      </div>
    </div>
