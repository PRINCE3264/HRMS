<app-page-header title="Recruitment" subtitle="Manage job openings and candidates" [breadcrumbs]="[{label:'Dashboard',link:'/dashboard'},{label:'Recruitment'}]">
      <button class="btn btn--primary"><i class="fas fa-plus"></i> Post New Opening</button>
    </app-page-header>

    <div class="tabs">
      <button class="tab" [class.active]="activeTab === 'openings'" (click)="activeTab = 'openings'">
        <i class="fas fa-briefcase"></i> Job Openings <span class="tab-count">{{ jobOpenings.length }}</span>
      </button>
      <button class="tab" [class.active]="activeTab === 'candidates'" (click)="activeTab = 'candidates'">
        <i class="fas fa-users"></i> Candidates <span class="tab-count">{{ candidates.length }}</span>
      </button>
    </div>

    <div *ngIf="activeTab === 'openings'">
      <div class="openings-grid">
        <div class="opening-card" *ngFor="let job of jobOpenings">
          <div class="opening-card__header">
            <h3>{{ job.title }}</h3>
            <app-status-badge [status]="job.status"></app-status-badge>
          </div>
          <div class="opening-card__meta">
            <span><i class="fas fa-building"></i> {{ job.department }}</span>
            <span><i class="fas fa-map-marker-alt"></i> {{ job.location }}</span>
            <span><i class="fas fa-briefcase"></i> {{ job.type }}</span>
          </div>
          <div class="opening-card__salary">{{ job.salaryRange }}</div>
          <div class="opening-card__footer">
            <span class="opening-card__posted">Posted {{ job.postedDate }}</span>
            <span class="opening-card__applicants"><i class="fas fa-users"></i> {{ job.applicants }} applicants</span>
          </div>
        </div>
      </div>
    </div>

    <div *ngIf="activeTab === 'candidates'">
      <app-data-table [columns]="candidateColumns" [data]="candidates" [pageSize]="10" [actions]="candidateActions" (onActionClick)="onAction($event)">
      </app-data-table>
    </div>
