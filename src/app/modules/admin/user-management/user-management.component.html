<app-page-header title="User Management" subtitle="Manage system users and access" [breadcrumbs]="[{label:'Dashboard',link:'/dashboard'},{label:'User Management'}]">
      <button class="btn btn--primary"><i class="fas fa-plus"></i> Add User</button>
    </app-page-header>

    <div class="user-stats">
      <div class="user-stat">
        <span class="user-stat__value">42</span>
        <span class="user-stat__label">Total Users</span>
      </div>
      <div class="user-stat">
        <span class="user-stat__value">38</span>
        <span class="user-stat__label">Active</span>
      </div>
      <div class="user-stat">
        <span class="user-stat__value">4</span>
        <span class="user-stat__label">Inactive</span>
      </div>
      <div class="user-stat">
        <span class="user-stat__value">6</span>
        <span class="user-stat__label">Admins</span>
      </div>
    </div>

    <app-data-table [columns]="columns" [data]="users" [pageSize]="10" [actions]="tableActions" (onActionClick)="onAction($event)">
    </app-data-table>
