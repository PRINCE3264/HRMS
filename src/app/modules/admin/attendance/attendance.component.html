<app-page-header title="Attendance Management" subtitle="Track employee attendance and working hours" [breadcrumbs]="[{label:'Dashboard',link:'/dashboard'},{label:'Attendance'}]">
      <button class="btn btn--outline"><i class="fas fa-download"></i> Download Report</button>
      <button class="btn btn--primary"><i class="fas fa-calendar-plus"></i> Mark Attendance</button>
    </app-page-header>

    <div class="filter-bar">
      <div class="filter-group">
        <input type="date" class="filter-input" />
      </div>
      <div class="filter-group">
        <select class="filter-select">
          <option value="">All Departments</option>
          <option>Engineering</option>
          <option>Marketing</option>
          <option>Sales</option>
          <option>HR</option>
          <option>Finance</option>
        </select>
      </div>
      <div class="filter-group">
        <select class="filter-select">
          <option value="">All Status</option>
          <option>Present</option>
          <option>Absent</option>
          <option>Late</option>
          <option>On Leave</option>
        </select>
      </div>
    </div>

    <div class="stats-row">
      <div class="mini-stat">
        <span class="mini-stat__value present">198</span>
        <span class="mini-stat__label">Present</span>
      </div>
      <div class="mini-stat">
        <span class="mini-stat__value absent">33</span>
        <span class="mini-stat__label">Absent</span>
      </div>
      <div class="mini-stat">
        <span class="mini-stat__value late">12</span>
        <span class="mini-stat__label">Late</span>
      </div>
      <div class="mini-stat">
        <span class="mini-stat__value leave">18</span>
        <span class="mini-stat__label">On Leave</span>
      </div>
      <div class="mini-stat">
        <span class="mini-stat__value wfh">27</span>
        <span class="mini-stat__label">Work From Home</span>
      </div>
    </div>

    <app-data-table [columns]="columns" [data]="attendanceRecords" [pageSize]="10" [actions]="tableActions" (onActionClick)="onAction($event)">
    </app-data-table>
