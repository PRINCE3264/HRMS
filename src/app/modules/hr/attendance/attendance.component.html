<app-page-header title="Attendance" subtitle="Track employee attendance and work hours" [breadcrumbs]="[{label:'Dashboard',link:'/dashboard'},{label:'Attendance'}]">
      <button class="btn btn--outline"><i class="fas fa-download"></i> Export</button>
      <button class="btn btn--primary"><i class="fas fa-calendar-plus"></i> Mark Attendance</button>
    </app-page-header>
    <div class="attendance-stats">
      <div class="stat-box present"><i class="fas fa-user-check"></i><div><span class="stat-num">198</span><span class="stat-text">Present</span></div></div>
      <div class="stat-box absent"><i class="fas fa-user-times"></i><div><span class="stat-num">33</span><span class="stat-text">Absent</span></div></div>
      <div class="stat-box late"><i class="fas fa-clock"></i><div><span class="stat-num">12</span><span class="stat-text">Late</span></div></div>
      <div class="stat-box wfh"><i class="fas fa-home"></i><div><span class="stat-num">18</span><span class="stat-text">Work From Home</span></div></div>
      <div class="stat-box leave"><i class="fas fa-calendar-minus"></i><div><span class="stat-num">14</span><span class="stat-text">On Leave</span></div></div>
    </div>
    <div class="table-card">
      <div class="table-header">
        <h3>Today's Attendance</h3>
        <div class="table-filters">
          <input type="text" placeholder="Search employees..." class="search-input">
          <select class="filter-select">
            <option>All Departments</option>
            <option>Engineering</option>
            <option>Marketing</option>
            <option>Finance</option>
          </select>
        </div>
      </div>
      <div class="table-wrapper">
        <table>
          <thead>
            <tr>
              <th>Employee</th>
              <th>Department</th>
              <th>Clock In</th>
              <th>Clock Out</th>
              <th>Hours</th>
              <th>Status</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody>
            <tr *ngFor="let a of attendance">
              <td>
                <div class="emp-cell">
                  <div class="avatar-sm" [style.background]="a.color">{{ a.name.charAt(0) }}</div>
                  <div><span class="emp-name">{{ a.name }}</span><br><span class="emp-id">{{ a.employeeId }}</span></div>
                </div>
              </td>
              <td>{{ a.department }}</td>
              <td><i class="fas fa-sign-in-alt" style="color:#10b981;margin-right:4px;"></i>{{ a.clockIn }}</td>
              <td><i class="fas fa-sign-out-alt" style="color:#ef4444;margin-right:4px;"></i>{{ a.clockOut || '—' }}</td>
              <td><strong>{{ a.hours || '—' }}</strong></td>
              <td><span class="status-badge" [class]="a.status.toLowerCase().replace(' ','-')">{{ a.status }}</span></td>
              <td>
                <button class="btn-icon" title="View Details"><i class="fas fa-eye"></i></button>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
