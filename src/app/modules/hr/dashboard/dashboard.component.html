<app-page-header title="HR Dashboard" subtitle="Human Resources overview" [breadcrumbs]="[{label:'Dashboard'}]"></app-page-header>
    <div class="stats-grid">
      <app-stat-card label="Total Employees" value="248" icon="fas fa-users" color="primary"></app-stat-card>
      <app-stat-card label="Present Today" value="198" icon="fas fa-user-check" color="success"></app-stat-card>
      <app-stat-card label="Absent Today" value="33" icon="fas fa-user-times" color="danger"></app-stat-card>
      <app-stat-card label="Pending Leaves" value="14" icon="fas fa-calendar-alt" color="warning"></app-stat-card>
      <app-stat-card label="New Joiners" value="8" icon="fas fa-user-plus" color="purple"></app-stat-card>
      <app-stat-card label="Open Positions" value="12" icon="fas fa-briefcase" color="info"></app-stat-card>
    </div>
    <div class="hr-row">
      <div class="section-card">
        <div class="section-header"><h3>Pending Leave Requests</h3></div>
        <div class="pending-list">
          <div class="pending-item" *ngFor="let req of pendingLeaves">
            <div class="pending-info">
              <div class="avatar-sm">{{ req.name.charAt(0) }}</div>
              <div><strong>{{ req.name }}</strong><br><small>{{ req.type }} &middot; {{ req.days }} day(s)</small></div>
            </div>
            <div class="pending-actions">
              <button class="btn-sm btn-approve"><i class="fas fa-check"></i></button>
              <button class="btn-sm btn-reject"><i class="fas fa-times"></i></button>
            </div>
          </div>
        </div>
      </div>
      <div class="section-card">
        <div class="section-header"><h3>Upcoming Birthdays</h3></div>
        <div class="birthday-list">
          <div class="birthday-item" *ngFor="let b of birthdays">
            <div class="avatar-sm">{{ b.name.charAt(0) }}</div>
            <div><strong>{{ b.name }}</strong><br><small>{{ b.date }}</small></div>
          </div>
        </div>
      </div>
    </div>
    <div class="hr-row" style="margin-top:20px;">
      <div class="section-card">
        <div class="section-header"><h3>Recent Activity</h3></div>
        <div class="activity-list">
          <div class="activity-item" *ngFor="let a of recentActivity">
            <i [class]="a.icon" [style.color]="a.color"></i>
            <div><span>{{ a.message }}</span><br><small>{{ a.time }}</small></div>
          </div>
        </div>
      </div>
      <div class="section-card">
        <div class="section-header"><h3>Department Distribution</h3></div>
        <div class="dept-list">
          <div class="dept-item" *ngFor="let d of departments">
            <div class="dept-info">
              <span class="dept-name">{{ d.name }}</span>
              <span class="dept-count">{{ d.count }} employees</span>
            </div>
            <div class="dept-bar">
              <div class="dept-bar-fill" [style.width]="d.pct + '%'" [style.background]="d.color"></div>
            </div>
          </div>
        </div>
      </div>
    </div>
